<!DOCTYPE html>
<html lang="pt">
<head>
  <title>Clube de Fotografia Formulário</title>
  <header>
     <h1>Clube de Fotografia</h1>
  </header>
<form action="#" method="post">
     <section>
     <label for="nome">Nome (obrigatório):</label>
     <input type="text" id="nome" name="nome" autocomplete="name">
     </section>
     <section>
     <label for="email">Email (obrigatório):</label>
     <input type="email" id="email" name="email" autocomplete="email">
     </section>
     <section>
     <label for="telemovel">Telemóvel (opcional):</label>
     <input type="tel" id="telemovel" name="telemovel" autocomplete="tel">
     </section>
     <label for="curso">Curso (obrigatório):</label>
     <select id="curso" name="curso" required>
       <option value="">Escolhe o teu curso</option>
       <option value="curso1">Curso de Programação</option>
       <option value="curso2">Curso de Turismo</option>
       <option value="curso3">Curso de Biologia</option>
       <option value="curso4">Curso de Automação</option>
     </select>
     <img width="550" height="450" src="https://odysseytours.pt/wp-content/uploads/2024/12/DJI_0384.MP4_snapshot_00.00_2021.03.10_01.20.16-scaled.jpg" alt="Foto do Farol">
     <fieldset>
       <legend>Ano</legend>
       <input type="radio" id="ano1" name="ano" value="1">
       <label for="ano1">1.º ano</label>
       <input type="radio" id="ano2" name="ano" value="2">
       <label for="ano2">2.º ano</label>
       <input type="radio" id="ano3" name="ano" value="3">
       <label for="ano3">3.º ano</label>
     </fieldset>
     <fieldset>
       <legend>Interesses</legend>
       <input type="checkbox" id="retrato" name="interesses" value="retrato">
       <label for="retrato">Retrato</label>
       <input type="checkbox" id="paisagem" name="interesses" value="paisagem">
       <label for="paisagem">Paisagem</label>
       <input type="checkbox" id="rua" name="interesses" value="rua">
       <label for="rua">Rua</label>
       <input type="checkbox" id="edicao" name="interesses" value="edicao">
       <label for="edicao">Edição</label>
     </fieldset>
     <label for="motivo">Porque queres entrar no clube?</label>
     <textarea id="motivo" name="motivo" rows="2" cols="50" aria-describedby="motivo-help"></textarea>
     <p id="motivo-help">Explica por que queres juntar-te ao clube de fotografia.</p>
     <input type="checkbox" id="consentimento" name="consentimento" required>
     <label for="consentimento">Autorizo o uso dos meus dados apenas para gerir a inscrição (obrigatório)</label>
     <button type="submit">Enviar inscrição</button>
     <footer>
       <p>Contacto do clube: <a href="mailto:info@clube-fotografia.pt">info@clube-fotografia.pt</a></p>
     </footer>
</form>
</html>
